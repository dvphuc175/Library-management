<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Thư Viện</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f9; }
        header { background-color: #007bff; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn-logout { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .btn-logout:hover { background-color: #c82333; }
        
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        
        /* Box chứa từng cuốn sách, set overflow hidden để tránh bị đè chữ */
        .book-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .book-card img { width: 100%; height: 300px; object-fit: cover; border-radius: 4px; margin-bottom: 15px; background-color: #eee; }
        .book-card h3 { margin: 0 0 10px 0; font-size: 18px; color: #333; }
        .book-card p { margin: 5px 0; color: #666; font-size: 14px; }
        .btn-action { margin-top: auto; background-color: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; }
        .btn-action:hover { background-color: #218838; }
        .btn-disabled { background-color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>Thư Viện Của Bạn</h1>
        <div class="user-info">
            <span id="userNameDisplay">Xin chào, Khách</span>
            <button class="btn-logout" id="btnLogout">Đăng xuất</button>
        </div>
    </header>

    <div class="container">
        <h2>Danh sách Đầu sách</h2>
        <div class="book-grid" id="bookList">
            </div>
    </div>

    <script src="js/reader.js"></script>
</body>
</html>
